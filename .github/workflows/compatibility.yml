name: Compatibility Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检出应用构建配置
        env:
          CUTOVER_REF: ${{ startsWith(github.ref_name, 'codex/named-v1-cutover-') && github.ref_name || '' }}
        run: |
          git clone --depth 1 --branch "${CUTOVER_REF:-main}" https://github.com/yzin-17/thesis-ledger.git ../thesis-ledger
          git clone --depth 1 --branch "${CUTOVER_REF:-yzin}" https://github.com/yzin-17/daily_stock_analysis.git ../daily-stock-analysis
          git -C ../thesis-ledger rev-parse HEAD
          git -C ../daily-stock-analysis rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: 安装锁定的测试依赖
        run: pnpm install --frozen-lockfile
      - name: 验证部署接口与运行时边界
        run: pnpm check
      - name: 验证编排、构建与维护工具
        run: pnpm test
      - name: 验证应用侧快更和恢复调用方
        run: |
          node --test ../daily-stock-analysis/scripts/deployment/sync-code.entry.test.mjs ../daily-stock-analysis/scripts/deployment/runtime-recovery*.test.mjs
