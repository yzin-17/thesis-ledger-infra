name: Compatibility Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate compatibility manifest
        run: node scripts/check-compatibility.mjs
      - name: 验证自动空间整备与保卷恢复
        run: |
          bash scripts/build-compose-service.test.sh
          bash scripts/build-space.test.sh
          bash scripts/build-space-lifecycle.test.sh
          bash scripts/reinstall-preserving-volumes.test.sh
          node --test scripts/docker-reinstall-plan.test.mjs
      - name: 验证固定SDK源预取与精确清理
        run: bash scripts/longbridge-build-source.test.sh
      - name: 验证数据快更、恢复与已验镜像复用入口
        run: |
          node --test scripts/dsa-code-payload.test.mjs scripts/sync-code-dsa.entry.test.mjs scripts/sync-dsa-files.test.mjs scripts/dsa-runtime-recovery.test.mjs scripts/dsa-runtime-recovery.entry.test.mjs
          bash scripts/sync-code.test.sh
          bash scripts/reuse-dsa-image.test.sh
          bash scripts/reuse-thesis-ledger-image.test.sh
      - name: 验证回滚镜像保留与更新阶段
        run: |
          node --test scripts/rollback-image-policy.test.mjs scripts/docker-space-images.test.mjs
          bash scripts/retain-rollback-images.test.sh
          bash scripts/rollback-image-update.test.sh
