services:
  dsa:
    build:
      context: ../daily-stock-analysis
      dockerfile: docker/Dockerfile
      args:
        DSA_WEB_VERSION: thesisledger-dev
        DSA_WEB_REVISION: local
    image: daily-stock-analysis:thesisledger-dev
    ports:
      - '8000:8000'

  thesis-ledger:
    build:
      context: ../thesis-ledger
      dockerfile: infra/docker/server.Dockerfile
    image: thesis-ledger:dev
    environment:
      DSA_TIMEOUT_MS: '30000'
