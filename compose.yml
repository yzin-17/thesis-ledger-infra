name: thesis-ledger-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-thesis_ledger}
      POSTGRES_DB: ${POSTGRES_DB:-thesis_ledger}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-thesis_ledger_app}
      POSTGRES_SCHEMA_VERSION: ${THESIS_LEDGER_SCHEMA_VERSION:-20260902000000_fresh_database_baseline}
    volumes:
      - thesis-ledger-postgres-data:/var/lib/postgresql/data
      - ../thesis-ledger/apps/server/prisma/migrations/20260902000000_fresh_database_baseline/migration.sql:/docker-entrypoint-initdb.d/001-current-baseline.sql:ro
      - ./scripts/bootstrap-app-role.sql:/docker-entrypoint-initdb.d/002-app-role.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -qAt -c 'SELECT "version" FROM "SchemaVersion" WHERE "id" = 1 LIMIT 1')" = "$$POSTGRES_SCHEMA_VERSION"
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - thesis-ledger-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  dsa:
    image: ${DSA_IMAGE:?DSA_IMAGE must be a published immutable digest}
    environment:
      THESIS_LEDGER_DSA_TOKEN: ${THESIS_LEDGER_DSA_TOKEN:?THESIS_LEDGER_DSA_TOKEN is required}
      THESIS_LEDGER_CONTROL_TOKEN: ${THESIS_LEDGER_CONTROL_TOKEN:?THESIS_LEDGER_CONTROL_TOKEN is required}
      THESIS_LEDGER_DSA_SECRET_KEY: ${THESIS_LEDGER_DSA_SECRET_KEY:?THESIS_LEDGER_DSA_SECRET_KEY is required}
      THESIS_LEDGER_DSA_SECRET_KEY_VERSION: ${THESIS_LEDGER_DSA_SECRET_KEY_VERSION:-v1}
      THESIS_LEDGER_DSA_SECRET_KEY_PREVIOUS: ${THESIS_LEDGER_DSA_SECRET_KEY_PREVIOUS:-}
      THESIS_LEDGER_DSA_SECRET_KEY_PREVIOUS_VERSION: ${THESIS_LEDGER_DSA_SECRET_KEY_PREVIOUS_VERSION:-v1}
      THESIS_LEDGER_FIXTURE_MODE: ${THESIS_LEDGER_FIXTURE_MODE:-false}
      EFINANCE_EASTMONEY_COOKIE: ${EFINANCE_EASTMONEY_COOKIE:-}
      ENABLE_EASTMONEY_PATCH: ${ENABLE_EASTMONEY_PATCH:-false}
      DATABASE_PATH: /app/data/stock_analysis.db
      API_PORT: 8000
    command: [python, main.py, --serve-only, --host, 0.0.0.0, --port, "8000"]
    expose: ["8000"]
    volumes:
      - thesis-ledger-dsa-data:/app/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/health]
      interval: 10s
      timeout: 5s
      retries: 12

  thesis-ledger:
    image: ${THESIS_LEDGER_IMAGE:?THESIS_LEDGER_IMAGE must be a published immutable digest}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:-thesis_ledger_app}@postgres:5432/${POSTGRES_DB:-thesis_ledger}
      REDIS_URL: redis://redis:6379
      DSA_BASE_URL: http://dsa:8000
      THESIS_LEDGER_DSA_TOKEN: ${THESIS_LEDGER_DSA_TOKEN:?THESIS_LEDGER_DSA_TOKEN is required}
      THESIS_LEDGER_CONTROL_TOKEN: ${THESIS_LEDGER_CONTROL_TOKEN:?THESIS_LEDGER_CONTROL_TOKEN is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    command: [node, apps/server/dist/src/main.js]
    ports: ["3000:3000"]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/v1/health]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      dsa: { condition: service_healthy }

volumes:
  thesis-ledger-postgres-data:
    name: thesis-ledger-postgres-data
    external: true
  thesis-ledger-redis-data:
    name: thesis-ledger-redis-data
    external: true
  thesis-ledger-dsa-data:
    name: thesis-ledger-dsa-data
    external: true
